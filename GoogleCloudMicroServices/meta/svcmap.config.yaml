version: '1'
product:
  name: GoogleCloudPlatform
  slug: ggogle-cloud-platform
  description: micro-services
knowledge_base:
  output_dir: GoogleCloudMicroServices
  commit_to_repo: false
  gitignore_extracted: true
provider:
  git: github
llm:
  provider: claude
  temperature: 0.2
services:
  cartservice:
    repo: GoogleCloudPlatform/microservices-demo
    branch: main
    include_paths:
      - src/cartservice/
  checkoutservice:
    repo: GoogleCloudPlatform/microservices-demo
    branch: main
    include_paths:
      - src/checkoutservice/
  productcatalogservice:
    repo: GoogleCloudPlatform/microservices-demo
    branch: main
    include_paths:
      - src/productcatalogservice/
  paymentservice:
    repo: GoogleCloudPlatform/microservices-demo
    branch: main
    include_paths:
      - src/paymentservice/
  recommendationservice:
    repo: GoogleCloudPlatform/microservices-demo
    branch: main
    include_paths:
      - src/recommendationservice/
generation:
  parallelism: 3
  retry_attempts: 2
  documents:
    service:
      overview: true
      api: true
      scenarios: true
      dependencies: true
      data_model: true
      table_map: true
      config: true
      errors: true
      coding_standards: true
      runbook: true
      architecture: true
      business_rules: true
